benewake_lidar_node:
  ros__parameters:
    model: "tfmini_s"
    port: "/dev/ttyAMA0"
    baudrate: 115200
    frame_id: "tfmini_s_link"
    topic: "/lidar/range"
    min_range: 0.1
    max_range: 12.0
    field_of_view: 0.04
    reconnect_interval: 2.0

distance_monitor:
  ros__parameters:
    threshold: 0.15
    input_topic: "/lidar/range"
    output_topic: "/lidar/too_close"
